name: Phase 3 runtime v2 repair

on:
  pull_request:
    paths:
      - "packages/contracts/src/runtime/**"
      - "services/runtime-fabric/src/README.md"
      - "services/runtime-fabric/src/spi/**"
      - "services/runtime-fabric/src/state-machine/**"
      - "services/runtime-fabric/src/providers/openshell/**"
      - "services/runtime-fabric/src/providers/tmux/**"
      - "services/runtime-fabric/src/exchange/**"
      - ".github/workflows/p3-runtime-v2-repair.yml"

permissions:
  contents: read

jobs:
  runtime-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Enforce repair path allowlist and control
        shell: bash
        run: |
          set -euo pipefail

          allowed_path() {
            case "$1" in
              .github/workflows/p3-runtime-v2-repair.yml|\
              services/runtime-fabric/src/README.md|\
              services/runtime-fabric/src/exchange/index.ts|\
              services/runtime-fabric/src/exchange/state-machine.ts|\
              services/runtime-fabric/src/providers/tmux/types.ts|\
              services/runtime-fabric/src/providers/tmux/selftest.ts|\
              packages/contracts/src/runtime/*|\
              services/runtime-fabric/src/spi/*|\
              services/runtime-fabric/src/state-machine/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          allowed_path "packages/contracts/src/runtime/types.ts" || {
            echo "Positive path-control fixture was rejected." >&2
            exit 1
          }
          if allowed_path "data/status/integration.json"; then
            echo "Convergence-owned negative-control path stayed green." >&2
            exit 1
          fi
          if allowed_path "services/runtime-fabric/src/providers/e2b/provider.ts"; then
            echo "Provider-private negative-control path stayed green." >&2
            exit 1
          fi

          unexpected=()
          while IFS= read -r -d '' path; do
            if ! allowed_path "$path"; then
              unexpected+=("$path")
            fi
          done < <(git diff --name-only -z "${{ github.event.pull_request.base.sha }}"...HEAD)

          if ((${#unexpected[@]} > 0)); then
            printf 'Repair PR changed paths outside its admitted lease:\n' >&2
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi
      - name: Compile v2 core and merged consumers
        run: |
          mkdir -p /tmp/runtime-v2-build
          bun build \
            packages/contracts/src/runtime/index.ts \
            services/runtime-fabric/src/spi/index.ts \
            services/runtime-fabric/src/state-machine/selftest.ts \
            services/runtime-fabric/src/providers/tmux/selftest.ts \
            services/runtime-fabric/src/exchange/index.ts \
            --target=bun \
            --outdir=/tmp/runtime-v2-build
      - name: Run repository and runtime foundation selftests
        run: bun scripts/selftest.ts
      - name: Run fixed-workflow tmux provider selftest
        run: bun services/runtime-fabric/src/providers/tmux/selftest.ts
      - name: Run OpenShell policy envelope assertions
        run: bun services/runtime-fabric/src/providers/openshell/openshell.test.ts
      - name: Run tmux session envelope assertions
        run: bun services/runtime-fabric/src/providers/tmux/tmux.test.ts
      - name: Run hybrid exchange assertions
        run: bun services/runtime-fabric/src/exchange/exchange.test.ts
      - name: Type-check exact head
        run: bunx tsc --noEmit
