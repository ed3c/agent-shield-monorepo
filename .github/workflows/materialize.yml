name: Materialize repository bootstrap

# One-shot staging materializer. The extracted repository does not retain this workflow.
on:
  push:
    branches:
      - feat/modular-bun-typescript-bootstrap
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive.part* > /tmp/agent-shield.tar.gz.b64
          base64 --decode /tmp/agent-shield.tar.gz.b64 > /tmp/agent-shield.tar.gz
          echo "1d683118eded495edea1e72e1b1f618f7a6ba1e0f8727b342fb43baf1430103f  /tmp/agent-shield.tar.gz" | sha256sum --check -

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/agent-shield.tar.gz -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement phased Agent Shield Bun TypeScript baseline"
          git push origin HEAD:feat/modular-bun-typescript-bootstrap
