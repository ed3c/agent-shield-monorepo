name: Materialize repository bootstrap

on:
  push:
    branches:
      - feat/modular-bun-typescript-bootstrap
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive.part* > /tmp/agent-shield.tar.gz.b64
          base64 --decode /tmp/agent-shield.tar.gz.b64 > /tmp/agent-shield.tar.gz
          echo "d3f752f3656b235a41ff28f9c1a4ed50eabff05039efae689f1056cb89f0c08b  /tmp/agent-shield.tar.gz" | sha256sum --check -

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/agent-shield.tar.gz -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement modular Agent Shield Bun TypeScript baseline"
          git push origin HEAD:feat/modular-bun-typescript-bootstrap
