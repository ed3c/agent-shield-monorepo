name: Phase 6 GitHub origin live canary

# LIVE-INT-GH / #145. This workflow is intentionally manual-only. Ordinary PR/push CI may
# compile and test the transport but cannot manufacture a live distribution-origin receipt.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-hex commit to verify at the GitHub distribution origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  github-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse movable or malformed subjects
        shell: bash
        env:
          SUBJECT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'commit input must be an exact 40-hex object identifier' >&2
            exit 1
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Bind checkout to the exact requested subject
        shell: bash
        env:
          SUBJECT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD^{commit})"
          [[ "$actual" == "$SUBJECT_COMMIT" ]] || {
            printf 'checkout resolved %s, expected %s\n' "$actual" "$SUBJECT_COMMIT" >&2
            exit 1
          }

      - name: Compile the live runner
        run: bun build scripts/integration/github-origin/live-runner.ts --target=bun --outdir=/tmp/int-gh-live-build

      - name: Run deterministic real-transport disagreement controls
        run: bun scripts/integration/github-origin/real-origin.test.ts

      - name: Execute the anonymous HTTPS origin canary
        shell: bash
        env:
          SUBJECT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/github-origin-receipt.json"
          bun scripts/integration/github-origin/live-runner.ts "$SUBJECT_COMMIT" > "$receipt"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); assert value["outcome"] == "RECEIPT_EMITTED"; assert value["freshClone"] is True; assert value["cleanupCleared"] is True' "$receipt"

      - name: Upload credential-free origin receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-origin-live-receipt
          path: ${{ runner.temp }}/github-origin-receipt.json
          if-no-files-found: error
          retention-days: 7
