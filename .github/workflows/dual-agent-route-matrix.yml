name: Dual-Agent route complete matrix

on:
  pull_request:
    paths:
      - "services/runtime-fabric/src/integrations/dual-agent-route/**"
      - ".github/workflows/dual-agent-route-matrix.yml"
  push:
    branches: [main]
    paths:
      - "services/runtime-fabric/src/integrations/dual-agent-route/**"
      - ".github/workflows/dual-agent-route-matrix.yml"

permissions:
  contents: read

jobs:
  route-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate convergence preflight JSON
        run: python3 -m json.tool services/runtime-fabric/src/integrations/dual-agent-route/matrix-preflight.json >/dev/null
      - name: Compile complete route candidate
        run: bun build services/runtime-fabric/src/integrations/dual-agent-route/matrix.ts --target=bun --outdir=/tmp/dual-agent-route-matrix
      - name: Re-run route contract controls
        run: bun services/runtime-fabric/src/integrations/dual-agent-route/selftest.ts
      - name: Re-run materialized API controls
        run: bun services/runtime-fabric/src/integrations/dual-agent-route/api/selftest.ts
      - name: Re-run materialized browser controls
        run: bun services/runtime-fabric/src/integrations/dual-agent-route/browser/selftest.ts
      - name: Re-run materialized policy controls
        run: bun services/runtime-fabric/src/integrations/dual-agent-route/policy/selftest.ts
      - name: Run complete route denominator and convergence controls
        run: bun services/runtime-fabric/src/integrations/dual-agent-route/matrix.ts
      - name: Typecheck repository
        run: bunx tsc --noEmit
