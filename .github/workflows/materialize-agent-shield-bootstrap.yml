name: Materialize Agent Shield bootstrap branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-agent-shield-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modular-bun-typescript-bootstrap
          fetch-depth: 0

      - name: Reconstruct the verified Bun and TypeScript source tree
        run: |
          set -euo pipefail
          cat .bootstrap/archive.part* > /tmp/agent-shield.tar.gz.b64
          base64 --decode /tmp/agent-shield.tar.gz.b64 > /tmp/agent-shield.tar.gz
          echo "1d683118eded495edea1e72e1b1f618f7a6ba1e0f8727b342fb43baf1430103f  /tmp/agent-shield.tar.gz" | sha256sum --check -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/agent-shield.tar.gz -C .

      - name: Commit the materialized source tree to the feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: implement phased Agent Shield Bun TypeScript baseline"
          git push origin HEAD:feat/modular-bun-typescript-bootstrap
