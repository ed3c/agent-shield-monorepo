name: Bun modular contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Compile TypeScript entrypoints
        run: |
          mkdir -p /tmp/build
          bun build \
            scripts/verify.ts \
            scripts/selftest.ts \
            scripts/verify-bettor-integration.ts \
            scripts/bootstrap-bettor.ts \
            scripts/release-manifest.ts \
            --target=bun \
            --outdir=/tmp/build
      # A tag is a moving reference. `actions/checkout@v4` today and `actions/checkout@v4`
      # after the tag is repointed are different code running with this repository's token, and
      # nothing in the diff records that it changed. Pinning every action by commit is the only
      # form of "exact subject" that survives someone else's release process.
      #
      # This step is what makes the pinning stick. Fixing the nine call sites once fixes today;
      # the next workflow added with a tag would pass every other check in this job.
      - name: Require every workflow action to be pinned by commit
        shell: bash
        run: |
          set -euo pipefail

          pinned() {
            # <owner>/<repo>[/<path>]@<40-hex>. Local (./) and docker:// uses are not tags.
            [[ "$1" =~ ^\./ ]] && return 0
            [[ "$1" =~ ^docker:// ]] && return 0
            [[ "$1" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@[0-9a-f]{40}$ ]]
          }

          # The gate has to be able to fail, so both fixtures run before the real scan. A guard
          # whose red path was never observed is the defect this step exists to prevent, one
          # level up.
          pinned "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" || {
            echo "Positive pinning fixture was rejected." >&2
            exit 1
          }
          if pinned "actions/checkout@v4"; then
            echo "Tag-referenced negative control stayed green." >&2
            exit 1
          fi
          if pinned "actions/checkout@11d5960a326750d5838078e36cf38b85af6772"; then
            echo "Short-digest negative control stayed green." >&2
            exit 1
          fi

          unpinned=()
          while IFS= read -r -d '' file; do
            while IFS= read -r reference; do
              pinned "$reference" || unpinned+=("$file: $reference")
            done < <(grep -oE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*\S+' "$file" | sed -E 's/.*uses:[[:space:]]*//')
          done < <(find .github/workflows -name '*.yml' -print0 | sort -z)

          if ((${#unpinned[@]} > 0)); then
            printf 'Workflow actions must be pinned by commit SHA:\n' >&2
            printf '  %s\n' "${unpinned[@]}" >&2
            exit 1
          fi
          echo "Every workflow action is pinned by commit."

      - name: Check Git Town Bash entrypoints
        run: |
          bash -n scripts/git-town/*.sh
          bash scripts/git-town/selftest.sh
      - run: bun scripts/verify.ts
      - run: bun scripts/selftest.ts
      - name: Run repository Bun tests when present
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \
            \( -name '*.test.ts' -o -name '*.spec.ts' -o -name '*_test_.ts' -o -name '*_spec_.ts' \) \
            -not -path './node_modules/*' \
            -print -quit | grep -q .; then
            bun test
          else
            echo 'No Bun test files are present on this exact head.'
          fi
      # `bun test` above discovers *.test.ts and nothing else, so a provider that names its eval
      # suite `selftest.ts` is type-checked by `bunx tsc --noEmit` and never executed. Six open
      # leaves are in exactly that state -- see #117 -- and their negative controls have never
      # run once. This step is what makes the file name stop mattering.
      - name: Run provider selftests when present
        shell: bash
        run: |
          set -euo pipefail

          discover() {
            find apps services packages -name 'selftest.ts' -not -path '*/node_modules/*' 2>/dev/null | sort
          }

          # A gate whose red path was never observed is the defect it exists to prevent, one
          # level up. Both controls run before the real suites, and both use a fixture in the
          # runner's own temp directory so nothing is ever created inside the checkout.
          control="${RUNNER_TEMP:-/tmp}/agent-shield-selftest-control"
          mkdir -p "$control"
          printf 'throw new Error("planted");\n' > "$control/selftest.ts"

          # 1. A throwing suite must fail. If `bun <file>` exited zero on a throw, every suite
          #    below would pass by construction.
          if bun "$control/selftest.ts" >/dev/null 2>&1; then
            echo 'A throwing selftest exited zero.' >&2
            exit 1
          fi
          # 2. Discovery must be scoped to the three declared roots. A fixture outside them must
          #    not appear, or this step would run whatever happens to be on the runner.
          if discover | grep -q 'agent-shield-selftest-control'; then
            echo 'Discovery reached outside the declared roots.' >&2
            exit 1
          fi
          echo 'controls: a throwing suite fails, and discovery stays inside apps/services/packages'

          mapfile -t suites < <(discover)
          if ((${#suites[@]} == 0)); then
            # Distinguishable from "they all passed", which is the whole point of #117.
            echo 'No provider selftest is present on this exact head.'
            exit 0
          fi

          for suite in "${suites[@]}"; do
            echo "--- $suite"
            bun "$suite"
          done

      - run: bun scripts/verify-bettor-integration.ts
      - name: Rebuild immutable module release
        run: bun scripts/release-manifest.ts --output /tmp/agent-shield-module-set.json
      - name: Upload expected module release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expected-agent-shield-release
          path: /tmp/agent-shield-module-set.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare immutable module release
        run: python3 -c 'import json; assert json.load(open("data/releases/agent-shield-module-set.json")) == json.load(open("/tmp/agent-shield-module-set.json"))'
      - run: bunx tsc --noEmit
