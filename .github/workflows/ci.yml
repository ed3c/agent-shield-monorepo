name: Bun modular contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Compile TypeScript entrypoints
        run: |
          mkdir -p /tmp/build
          bun build \
            scripts/verify.ts \
            scripts/selftest.ts \
            scripts/verify-bettor-integration.ts \
            scripts/bootstrap-bettor.ts \
            scripts/release-manifest.ts \
            --target=bun \
            --outdir=/tmp/build
      - name: Check Git Town Bash entrypoints
        run: |
          bash -n scripts/git-town/*.sh
          bash scripts/git-town/selftest.sh
      - run: bun scripts/verify.ts
      - run: bun scripts/selftest.ts
      - name: Run repository Bun tests when present
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \
            \( -name '*.test.ts' -o -name '*.spec.ts' -o -name '*_test_.ts' -o -name '*_spec_.ts' \) \
            -not -path './node_modules/*' \
            -print -quit | grep -q .; then
            bun test
          else
            echo 'No Bun test files are present on this exact head.'
          fi
      - run: bun scripts/verify-bettor-integration.ts
      - name: Rebuild immutable module release
        run: bun scripts/release-manifest.ts --output /tmp/agent-shield-module-set.json
      - name: Upload expected module release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expected-agent-shield-release
          path: /tmp/agent-shield-module-set.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare immutable module release
        run: python3 -c 'import json; assert json.load(open("data/releases/agent-shield-module-set.json")) == json.load(open("/tmp/agent-shield-module-set.json"))'
      - run: bunx tsc --noEmit
