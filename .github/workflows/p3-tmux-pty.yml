name: Phase 3 tmux provider contracts

on:
  pull_request:
    paths:
      - "services/runtime-fabric/src/providers/tmux/**"
      - ".github/workflows/p3-tmux-pty.yml"
  push:
    branches: [main]
    paths:
      - "services/runtime-fabric/src/providers/tmux/**"
      - ".github/workflows/p3-tmux-pty.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Compile tmux provider selftest
        run: bun build services/runtime-fabric/src/providers/tmux/selftest.ts --target=bun --outdir=/tmp/rt-tmux-build
      - name: Run tmux provider positive and disagreement controls
        run: bun services/runtime-fabric/src/providers/tmux/selftest.ts
      - name: Typecheck repository
        run: bunx tsc --noEmit
