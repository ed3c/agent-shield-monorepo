name: Documentation governance gate

on:
  pull_request:
    paths:
      - "scripts/docs-gate/**"
      - ".github/workflows/docs-gate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/docs-gate/**"
      - ".github/workflows/docs-gate.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Compile the governance validator
        run: bun build scripts/docs-gate/docs-gate.test.ts --target=bun --outdir=/tmp/docs-gate-build
      # DOC-GATE-010: the deterministic lane runs with no network and no token. The GitHub
      # metadata lane is not selected here, so the receipt reports it NOT_EXERCISED rather
      # than letting its absence read as a pass.
      - name: Run the governance gates and the mutation suite
        run: bun scripts/docs-gate/docs-gate.test.ts
      - name: Typecheck repository
        run: bunx tsc --noEmit
