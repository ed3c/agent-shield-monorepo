name: Dual-Agent gVisor runsc adapter

on:
  pull_request:
    paths:
      - "services/runtime-fabric/src/providers/gvisor/**"
      - ".github/workflows/dual-agent-gvisor-adapter.yml"
  push:
    branches: [main]
    paths:
      - "services/runtime-fabric/src/providers/gvisor/**"
      - ".github/workflows/dual-agent-gvisor-adapter.yml"

permissions:
  contents: read

jobs:
  gvisor-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Re-run gVisor provider contract controls
        run: bun services/runtime-fabric/src/providers/gvisor/selftest.ts
      - name: Compile runsc adapter selftest
        run: bun build services/runtime-fabric/src/providers/gvisor/adapter-selftest.ts --target=bun --outdir=/tmp/gvisor-adapter
      - name: Run deterministic runsc adapter controls
        run: bun services/runtime-fabric/src/providers/gvisor/adapter-selftest.ts
      - name: Typecheck repository
        run: bunx tsc --noEmit
