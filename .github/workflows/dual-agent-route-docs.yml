name: Dual-Agent route docs convergence

on:
  pull_request:
    paths:
      - "services/runtime-fabric/src/integrations/dual-agent-route/README.md"
      - "services/runtime-fabric/src/integrations/dual-agent-route/AGENTS.md"
      - "services/runtime-fabric/src/integrations/dual-agent-route/stack-index.json"
      - "services/runtime-fabric/src/integrations/dual-agent-route/docs-selftest.ts"
      - ".github/workflows/dual-agent-route-docs.yml"
  push:
    branches: [main]
    paths:
      - "services/runtime-fabric/src/integrations/dual-agent-route/README.md"
      - "services/runtime-fabric/src/integrations/dual-agent-route/AGENTS.md"
      - "services/runtime-fabric/src/integrations/dual-agent-route/stack-index.json"
      - "services/runtime-fabric/src/integrations/dual-agent-route/docs-selftest.ts"
      - ".github/workflows/dual-agent-route-docs.yml"

permissions:
  contents: read

jobs:
  route-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate Stack index JSON
        run: python3 -m json.tool services/runtime-fabric/src/integrations/dual-agent-route/stack-index.json >/dev/null
      - name: Re-run complete deterministic route matrix
        run: bun services/runtime-fabric/src/integrations/dual-agent-route/matrix.ts
      - name: Compile docs verifier
        run: bun build services/runtime-fabric/src/integrations/dual-agent-route/docs-selftest.ts --target=bun --outdir=/tmp/dual-agent-route-docs
      - name: Run Agent/read-route traceability controls
        run: bun services/runtime-fabric/src/integrations/dual-agent-route/docs-selftest.ts
      - name: Typecheck repository
        run: bunx tsc --noEmit
