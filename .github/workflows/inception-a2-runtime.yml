name: Inception A2 sandbox-steering preflight

on:
  push:
    branches:
      - agent/inception-a2-runtime-sandbox-steering
  pull_request:
    paths:
      - docs/integration/inception-a2-sandbox/**
      - services/runtime-fabric/src/providers/inception-sandbox/**
      - services/runtime-fabric/src/steering/inception/**
      - services/runtime-fabric/tests/inception/**
      - data/receipts/inception-a2/**
      - .github/workflows/inception-a2-runtime.yml

permissions:
  contents: read

jobs:
  deterministic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A2 preparation manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          manifest_path = root / "docs/integration/inception-a2-sandbox/preflight.json"
          readme_path = root / "docs/integration/inception-a2-sandbox/README.md"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          readme = readme_path.read_text(encoding="utf-8")

          expected = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A2",
              "stage": "OWNER_IMPLEMENTATION_PREPARATION",
              "state": "READY_FOR_FIRST_IMPLEMENTATION_COMMIT",
              "repository": "ed3c/agent-shield-monorepo",
              "branch": "agent/inception-a2-runtime-sandbox-steering",
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, f"DRIFT:{key}:{manifest.get(key)!r}"

          base = manifest["base_subject"]
          assert base == {
              "commit": "30e12cc917503b56b002aa7351428811f20fea8e",
              "tree": "6f465f936515d81ed51c5b80595de530593f25fc",
          }, "BASE_SUBJECT_DRIFT"
          runtime = manifest["runtime_contract_subject"]
          assert runtime["base_commit"] == "c0790b9a8c81d7eb45ed45ac3d761c7fad5baa9b"
          assert runtime["base_tree"] == "df39f33f7a5278d255a022789b9f94c9b4a073b9"
          assert runtime["state"] == "PREPARATION_ONLY"
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert controller["tree"] == "c3851a6953d456d0342a9776eed28561c1af0ca1"
          assert controller["packet_digest"] == "sha256:18e6a7c89d6f6de322b68fd1c2928fcc6c4cd42508236bb1ca03957435106aec"
          assert controller["bundle_digest"] == "sha256:dc4473b3195a738e55eb49c43661b6e1f4ea7f95c66749454776f2003b18ebc3"

          for key in (
              "state_machine",
              "existing_mechanisms",
              "writable_paths",
              "read_only_paths",
              "resource_leases",
              "capability_fields",
              "required_evidence_lanes",
              "positive_controls",
              "mutation_controls",
              "forbidden_actions",
              "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values, f"EMPTY_OR_MISSING:{key}"
              assert len(values) == len(set(values)), f"DUPLICATE:{key}"

          assert not (set(manifest["writable_paths"]) & set(manifest["read_only_paths"])), "LEASE_OVERLAP"
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["cleanup_contract"]["rollback_subject"] == base["commit"]
          assert manifest["next_transition"] == "ADD_CLOSED_ADAPTER_CAPABILITY_CONTRACT_AND_FIRST_HOLLOW_CONTROL"
          assert "OWNER IMPLEMENTATION PREPARATION ONLY" in readme
          assert "Hidden reasoning access is `ABSENT`" in readme
          assert "default-deny network" in readme

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"],
              text=True,
          ).splitlines()
          allowed = {
              "docs/integration/inception-a2-sandbox/README.md",
              "docs/integration/inception-a2-sandbox/preflight.json",
              ".github/workflows/inception-a2-runtime.yml",
          }
          unexpected = sorted(set(changed) - allowed)
          assert not unexpected, f"PATH_LEASE_VIOLATION:{unexpected}"

          combined = readme + "\n" + json.dumps(manifest, ensure_ascii=False)
          for forbidden in ("/Users/", "/home/", "/mnt/data/", "gemini.google.com", "BEGIN PRIVATE KEY"):
              assert forbidden not in combined, f"PRIVATE_LOCATOR_OR_SECRET:{forbidden}"
          assert not re.search(r"(?i)(api[_-]?key|password|private[_-]?key)\s*[:=]\s*['\"][^'\"]+", combined)

          print(
              "PASS atom=INCEPTION-A2 state=READY_FOR_FIRST_IMPLEMENTATION_COMMIT "
              f"changed={len(changed)} mutations={len(manifest['mutation_controls'])}"
          )
          PY

      - name: Check textual patch hygiene
        run: git diff --check
