name: Inception A2 sandbox-steering implementation

on:
  push:
    branches: [agent/inception-a2-runtime-sandbox-steering]
  pull_request:
    paths:
      - docs/integration/inception-a2-sandbox/**
      - services/runtime-fabric/src/providers/inception-sandbox/**
      - services/runtime-fabric/src/steering/inception/**
      - services/runtime-fabric/tests/inception/**
      - data/receipts/inception-a2/**
      - .github/workflows/inception-a2-runtime.yml

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact A2 manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          manifest = json.loads((root / "docs/integration/inception-a2-sandbox/preflight.json").read_text())
          exact = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A2",
              "stage": "OWNER_IMPLEMENTATION",
              "state": "FIRST_IMPLEMENTATION_CANDIDATE",
              "repository": "ed3c/agent-shield-monorepo",
              "branch": "agent/inception-a2-runtime-sandbox-steering",
          }
          for key, value in exact.items():
              assert manifest.get(key) == value, f"DRIFT:{key}"
          base = manifest["base_subject"]
          assert base == {"commit": "30e12cc917503b56b002aa7351428811f20fea8e", "tree": "6f465f936515d81ed51c5b80595de530593f25fc"}
          runtime = manifest["runtime_contract_subject"]
          assert runtime["commit"] == "cdfe74ac993cb0b4795fa80df237e8bb542409d2"
          assert runtime["tree"] == "0b2db695cdd812f81924b82689d96e3557b80158"
          assert runtime["state"] == "FIRST_IMPLEMENTATION_CANDIDATE"
          assert runtime["deterministic_runs"] == [32248796959, 32248796967]
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert controller["packet_digest"] == "sha256:18e6a7c89d6f6de322b68fd1c2928fcc6c4cd42508236bb1ca03957435106aec"
          for key in (
              "state_machine", "existing_mechanisms", "implementation_subjects",
              "writable_paths", "read_only_paths", "resource_leases", "capability_fields",
              "required_evidence_lanes", "positive_controls", "mutation_controls",
              "forbidden_actions", "claims_not_proven",
          ):
              values = manifest.get(key)
              assert isinstance(values, list) and values, key
          assert not set(manifest["writable_paths"]) & set(manifest["read_only_paths"])
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["next_transition"] == "ADD_REVERSIBLE_LOCAL_SANDBOX_FIXTURE_AND_TERMINAL_RESIDUE_RECEIPT"

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base['commit']}...HEAD"], text=True
          ).splitlines()
          allowed_exact = {".github/workflows/inception-a2-runtime.yml"}
          allowed_prefixes = (
              "docs/integration/inception-a2-sandbox/",
              "services/runtime-fabric/src/providers/inception-sandbox/",
              "services/runtime-fabric/src/steering/inception/",
              "services/runtime-fabric/tests/inception/",
              "data/receipts/inception-a2/",
          )
          violations = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          assert not violations, f"PATH_LEASE_VIOLATION:{violations}"
          required = {
              "services/runtime-fabric/src/providers/inception-sandbox/types.ts",
              "services/runtime-fabric/src/providers/inception-sandbox/validate.ts",
              "services/runtime-fabric/tests/inception/selftest.ts",
          }
          assert required.issubset(set(changed)), "IMPLEMENTATION_SUBJECT_MISSING"
          print(f"PASS atom=INCEPTION-A2 changed={len(changed)} mutations={len(manifest['mutation_controls'])}")
          PY

      - name: Execute sandbox and steering disagreement controls
        run: bun services/runtime-fabric/tests/inception/selftest.ts

      - name: Run repository deterministic controls
        run: |
          bun scripts/verify.ts
          bun scripts/selftest.ts
          bunx tsc --noEmit

      - name: Check textual patch hygiene
        run: git diff --check
