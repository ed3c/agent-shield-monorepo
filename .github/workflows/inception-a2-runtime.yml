name: Inception A2 sandbox-steering public verification

on:
  push:
    branches: [agent/inception-a2-runtime-sandbox-steering]
  pull_request:
    paths:
      - docs/integration/inception-a2-sandbox/**
      - services/runtime-fabric/src/providers/inception-sandbox/**
      - services/runtime-fabric/src/steering/inception/**
      - services/runtime-fabric/tests/inception/**
      - data/receipts/inception-a2/**
      - .github/workflows/inception-a2-runtime.yml

permissions:
  contents: read

jobs:
  local-fixture-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install exact Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Validate exact A2 verification manifest and lease
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          manifest = json.loads((root / "docs/integration/inception-a2-sandbox/preflight.json").read_text())
          exact = {
              "schema_version": "inception-owner-preflight/v1",
              "atom_id": "INCEPTION-A2",
              "stage": "OWNER_PUBLIC_VERIFICATION",
              "state": "LOCAL_FIXTURE_CANDIDATE",
              "repository": "ed3c/agent-shield-monorepo",
              "branch": "agent/inception-a2-runtime-sandbox-steering",
          }
          for key, value in exact.items():
              assert manifest.get(key) == value, f"DRIFT:{key}"
          runtime = manifest["runtime_contract_subject"]
          assert runtime["commit"] == "cdfe74ac993cb0b4795fa80df237e8bb542409d2"
          assert runtime["tree"] == "0b2db695cdd812f81924b82689d96e3557b80158"
          assert runtime["state"] == "FIRST_IMPLEMENTATION_CANDIDATE"
          controller = manifest["controller_subject"]
          assert controller["commit"] == "6e0a916fd06dd8635d77c9a8c4d1b475185ea13e"
          assert manifest["cleanup_contract"]["required"] is True
          assert manifest["next_transition"] == "RUN_NETWORK_ISOLATION_AND_PROVIDER_CAPABILITY_CANARIES"
          required = {
              "services/runtime-fabric/src/providers/inception-sandbox/types.ts",
              "services/runtime-fabric/src/providers/inception-sandbox/validate.ts",
              "services/runtime-fabric/src/providers/inception-sandbox/local-fixture.ts",
              "services/runtime-fabric/src/providers/inception-sandbox/local-fixture-probe.ts",
              "services/runtime-fabric/tests/inception/selftest.ts",
              "services/runtime-fabric/tests/inception/local-fixture.test.ts",
          }
          assert required.issubset(set(manifest["implementation_subjects"])), "IMPLEMENTATION_SUBJECT_MISSING"
          assert "PUBLIC_LOCAL_PROCESS_FIXTURE" in manifest["required_evidence_lanes"]
          assert "PROVIDER_OBSERVATION_SEPARATE" in manifest["required_evidence_lanes"]
          assert "NETWORK_ISOLATION_SEPARATE" in manifest["required_evidence_lanes"]

          base = manifest["base_subject"]["commit"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"], text=True
          ).splitlines()
          allowed_exact = {".github/workflows/inception-a2-runtime.yml"}
          allowed_prefixes = (
              "docs/integration/inception-a2-sandbox/",
              "services/runtime-fabric/src/providers/inception-sandbox/",
              "services/runtime-fabric/src/steering/inception/",
              "services/runtime-fabric/tests/inception/",
              "data/receipts/inception-a2/",
          )
          violations = [p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          assert not violations, f"PATH_LEASE_VIOLATION:{violations}"
          print(f"PASS atom=INCEPTION-A2 changed={len(changed)}")
          PY

      - name: Execute sandbox and steering disagreement controls
        run: bun services/runtime-fabric/tests/inception/selftest.ts

      - name: Execute reversible local fixture and terminal residue controls
        run: bun services/runtime-fabric/tests/inception/local-fixture.test.ts

      - name: Run repository deterministic controls
        run: |
          bun scripts/verify.ts
          bun scripts/selftest.ts
          bunx tsc --noEmit

      - name: Check textual patch hygiene
        run: git diff --check
