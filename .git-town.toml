# Team-owned Git Town 24.0 configuration.
# Local metadata and environment variables may only tighten this policy.
interactive = false

[branches]
main = "main"
default-type = "feature"
perennial-regex = "^(main|release/.*)$"

[create]
branch-prefix = ""
new-branch-type = "feature"
share-new-branches = "push"

[hosting]
dev-remote = "origin"
forge-type = "github"

[propose]
breadcrumb = "stacks"
breadcrumb-direction = "down"

[ship]
delete-tracking-branch = true
strategy = "api"

[sync]
auto-sync = true
feature-strategy = "rebase"
perennial-strategy = "ff-only"
prototype-strategy = "rebase"
push-branches = true
push-hook = true
tags = false
upstream = false
