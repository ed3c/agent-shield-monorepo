# Team-owned Git Town 24.0.0 policy.
# Local metadata and environment variables may only tighten this policy.
interactive = false

[branches]
main = "main"
default-type = "feature"
perennial-regex = "^(main|release/.*)$"

[create]
branch-prefix = ""
new-branch-type = "feature"
# A Worker must explicitly publish after its issue packet and evals are valid.
share-new-branches = "no"

[hosting]
dev-remote = "origin"
forge-type = "github"

[propose]
breadcrumb = "stacks"
breadcrumb-direction = "down"

[ship]
# `git town ship` remains human-owned; these settings do not authorize Workers.
delete-tracking-branch = true
strategy = "api"

[sync]
# Bash wrappers own synchronization and make every mutation visible.
auto-sync = false
auto-resolve = false
feature-strategy = "rebase"
perennial-strategy = "ff-only"
prototype-strategy = "rebase"
# Default is local-only. The admitted wrapper adds --push only with two explicit guards.
push-branches = false
push-hook = true
tags = false
upstream = false
